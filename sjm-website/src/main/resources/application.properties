spring.application.name=sjm-website
server.address=0.0.0.0
server.port=${PORT:8080}

# Production: JPA_DDL_AUTO=validate after scripts/setup-sjm-website-db.sql. Default update lets local H2 boot.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=sjm
spring.jpa.open-in-view=false

# Local default is H2 so the module boots without Postgres. Production should set DATABASE_URL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:sjm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS sjm}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# Reuse existing Mandir keys — do not add a second timezone key for Calendar.
app.timezone=America/Chicago
mandir.address.line1=5N515 IL-59
mandir.address.city=Bartlett
mandir.address.state=IL
mandir.address.zip=60103

# Feature flag default OFF. Credentials are env-only (never app_property / never git).
mandir.google-calendar.enabled=false
mandir.google-calendar.calendar-id=${GOOGLE_CALENDAR_MANDIR_ID:}
mandir.google-calendar.account-email=sjm.itteam@gmail.com
# GOOGLE_CALENDAR_CREDENTIALS_JSON or GOOGLE_CALENDAR_CREDENTIALS_PATH

spring.messages.basename=messages
